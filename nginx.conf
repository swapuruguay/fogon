# Nginx server block para FOGON - Club Deportivo
# Copiar este contenido a /etc/nginx/sites-available/fogon

server {
    listen 80;
    server_name otro.com;  # Cambiar por tu dominio

    # Document root - ajustar según tu instalación
    root /home/walter/proyectos/php/fogon;
    index index.php;

    # Log files
    access_log /var/log/nginx/fogon_access.log;
    error_log  /var/log/nginx/fogon_error.log;

    # =============================================
    # URL Rewriting (equivalente al .htaccess)
    # =============================================

    # Route all requests to index.php
    location / {
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }

    # =============================================
    # PHP-FPM
    # =============================================

    location ~ \.php$ {
        # Ajustar según tu versión de PHP-FPM
        fastcgi_pass unix:/run/php/php-fpm.sock;
        # O alternativa: fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Tiempo de ejecución (para reportes PDF largos)
        fastcgi_read_timeout 300;
    }

    # =============================================
    # Seguridad (equivalente al .htaccess)
    # =============================================

    # Bloquear archivos ocultos (.env, .git, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear archivos sensibles
    location ~* (composer\.(json|lock)|\.env|\.git)$ {
        deny all;
    }

    # Bloquear acceso directo a app/, models/, controllers/, libs/
    location ~ ^/(app|models|controllers|libs)/ {
        deny all;
    }

    # =============================================
    # Security Headers
    # =============================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =============================================
    # Assets estáticos (caché)
    # =============================================

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deshabilitar listado de directorios
    autoindex off;
}
